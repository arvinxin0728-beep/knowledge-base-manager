name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Run regression suite
        run: python3 tests/run_all.py
      - name: Enforce architecture ratchets
        run: python3 scripts/architecture_check.py --strict
      - name: Enforce release and privacy gates
        run: python3 scripts/kb_manager.py package-lint --strict
